<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Email confirmed · StreamBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <!--
    Where the "Confirm my email" link lands. Supabase confirms the address before
    sending the browser here; this page only tells the user what happened.
    Supabase adds ?error=...&error_code=... (or the same after #) when the link
    didn't work, e.g. it expired or was already used.
  -->
  <style>
    :root {
      --page: #C799FC;
      --window: #C799FD;
      --titlebar: #612298;
      --ink: #220937;
      --purple-ink: #440D72;
      --green: #63D887;
      --pink: #F08BAB;
      --yellow: #FFF14D;
      --display: "Bricolage Grotesque", system-ui, sans-serif;
      --body: "Space Grotesk", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 16px 40px;
      background: var(--page) url("zigzag.svg") center / cover no-repeat;
      color: var(--ink);
      font-family: var(--body);
    }

    .logo { width: min(260px, 62vw); filter: brightness(0); }

    .window {
      width: 100%;
      max-width: 560px;
      border: 4px solid #000;
      border-radius: 18px;
      background: var(--window);
      box-shadow: -14px 18px 0 #000;
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 22px;
      background: var(--titlebar);
      border-bottom: 4px solid #000;
    }
    .titlebar img { height: 34px; }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 32px 38px;
      text-align: center;
    }

    .badge {
      display: grid;
      place-items: center;
      width: 104px;
      height: 104px;
      border: 4px solid #000;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 6px 6px 0 #000;
    }
    .badge svg { width: 54px; height: 54px; }
    .is-error .badge { background: var(--pink); }

    h1 {
      margin: 26px 0 0;
      font-family: var(--display);
      font-size: clamp(30px, 7vw, 42px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--purple-ink); }

    .lead {
      max-width: 400px;
      margin: 14px 0 0;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
    }

    .next {
      width: 100%;
      max-width: 400px;
      margin: 26px 0 0;
      padding: 16px 20px;
      border: 3px solid #000;
      border-radius: 10px;
      background: #fff;
      box-shadow: 5px 6px 0 #000;
      text-align: left;
      list-style: none;
      counter-reset: step;
    }
    .next li {
      display: flex;
      align-items: center;
      gap: 12px;
      counter-increment: step;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }
    .next li + li { margin-top: 12px; }
    .next li::before {
      content: counter(step);
      display: grid;
      flex-shrink: 0;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 3px 1px 0 #000;
      font-family: var(--display);
      font-size: 16px;
    }

    .fineprint {
      margin: 22px 0 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--purple-ink);
    }

    @media (max-width: 480px) {
      .window { box-shadow: -8px 10px 0 #000; }
      .content { padding: 28px 20px 30px; }
      .badge { width: 88px; height: 88px; }
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="StreamBuddy">

  <main class="window" id="card">
    <div class="titlebar"><img src="window-controls.svg" alt=""></div>
    <div class="content">
      <div class="badge" aria-hidden="true">
        <svg id="icon" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5l4.5 4.5L19 7.5"/>
        </svg>
      </div>

      <h1 id="title">Email <span>confirmed</span></h1>
      <p class="lead" id="lead">You're all set! Your StreamBuddy account is ready to go.</p>

      <ol class="next" id="steps">
        <li>Head back to the StreamBuddy app</li>
        <li>Log in with your email and password</li>
      </ol>

      <p class="fineprint" id="fineprint">You can close this tab now.</p>
    </div>
  </main>

  <script>
    // Supabase reports problems in the query string or after the #
    const params = new URLSearchParams(location.search)
    const hash = new URLSearchParams(location.hash.slice(1))
    const errorCode = params.get('error_code') || hash.get('error_code')
    const error = params.get('error') || hash.get('error')

    if (error || errorCode) {
      const expired = errorCode === 'otp_expired'
      document.getElementById('card').classList.add('is-error')
      document.title = (expired ? 'Link expired' : 'Link not valid') + ' · StreamBuddy'
      document.getElementById('icon').innerHTML = '<path d="M7 7l10 10M17 7L7 17"/>'
      document.getElementById('title').innerHTML = expired
        ? 'Link <span>expired</span>'
        : 'Link <span>didn’t work</span>'
      document.getElementById('lead').textContent = expired
        ? 'Confirmation links only work once and expire after a while. No worries, it’s quick to get a new one.'
        : 'This confirmation link isn’t valid anymore. It may have been used already, or copied incompletely.'
      document.getElementById('steps').innerHTML =
        '<li>Open the StreamBuddy app and log in</li>' +
        '<li>Press “Resend confirmation email” and use the newest link</li>'
      document.getElementById('fineprint').textContent =
        'Already confirmed? Then you can just log in.'
    }

    // The one-time code in the address isn't needed here, so keep the URL tidy
    if (location.search || location.hash) history.replaceState(null, '', location.pathname)
  </script>
</body>
</html>
